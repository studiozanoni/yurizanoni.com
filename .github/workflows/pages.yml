name: Configure GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main and set custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -f "source[branch]=main" -f "source[path]=/"
          # Prefer pointing plus custom domain; fall back to source only if the domain is already taken.
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f "source[branch]=main" -f "source[path]=/" \
            -f cname='yurizanoni.com'
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Custom domain could not be set (it may already be claimed). Enabling Pages from main only."
            gh api --method PUT "repos/${{ github.repository }}/pages" \
              -f "source[branch]=main" -f "source[path]=/"
          fi
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -F https_enforced=true || echo "HTTPS enforcement not ready yet; certificate may still be provisioning."
          gh api "repos/${{ github.repository }}/pages" || true
